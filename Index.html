<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENA - Sistema Industrial de Control de Equipos</title>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Librerías para QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --sena-green: #39A900;
            --sena-green-glow: rgba(57, 169, 0, 0.4);
            --industrial-dark: #121418;
            --industrial-panel: #1e2229;
            --industrial-border: #2d333b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --alert-red: #ff3b3b;
            --alert-orange: #ff9800;
            --alert-blue: #00a8ff;
        }

        body, html {
            font-family: 'Roboto', sans-serif; background-color: var(--industrial-dark);
            color: var(--text-main); margin: 0; padding: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(18, 20, 24, 0.95), rgba(18, 20, 24, 0.95)),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.01) 10px, rgba(255,255,255,0.01) 20px);
        }

        h1, h2, h3, h4 { font-family: 'Jura', sans-serif; color: var(--sena-green); text-transform: uppercase; margin-top: 0; }
        .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 15px; box-sizing: border-box; }

        .card {
            background: var(--industrial-panel); padding: 25px; border-radius: 6px;
            border: 1px solid var(--industrial-border); border-left: 5px solid var(--sena-green);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); margin-bottom: 20px; position: relative;
        }

        .hidden { display: none !important; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }

        input, select {
            width: 100%; padding: 14px; background-color: #0b0d10; border: 1px solid var(--industrial-border);
            color: var(--text-main); border-radius: 4px; font-family: 'Roboto', sans-serif; font-size: 16px;
            box-sizing: border-box; transition: all 0.3s ease;
        }
        input:focus, select:focus { outline: none; border-color: var(--sena-green); box-shadow: 0 0 10px var(--sena-green-glow); }

        button {
            background-color: var(--sena-green); color: #000; border: none; padding: 16px 20px;
            border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; text-transform: uppercase;
            width: 100%; font-family: 'Jura', sans-serif; transition: all 0.2s ease;
        }
        button:active { transform: scale(0.98); }

        .btn-danger { background-color: transparent; border: 1px solid var(--alert-red); color: var(--alert-red); padding: 10px; width: auto; font-size: 14px; }
        .btn-danger:active { background-color: var(--alert-red); color: #fff; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--industrial-border); }
        th { background-color: #16191f; color: var(--sena-green); font-family: 'Jura', sans-serif; }
        
        .alert { padding: 15px; margin-bottom: 15px; border-radius: 4px; font-weight: bold; text-align: center; border-left: 4px solid; text-transform: uppercase; font-family: 'Jura'; font-size: 1.1rem;}
        .alert-error { background-color: rgba(255, 59, 59, 0.1); color: #ff6b6b; border-color: var(--alert-red); }
        .alert-success { background-color: rgba(57, 169, 0, 0.1); color: var(--sena-green); border-color: var(--sena-green); }
        .alert-warning { background-color: rgba(255, 152, 0, 0.1); color: var(--alert-orange); border-color: var(--alert-orange); }
        .alert-info { background-color: rgba(0, 168, 255, 0.1); color: var(--alert-blue); border-color: var(--alert-blue); }

        .nav-bar { display: flex; justify-content: space-between; align-items: center; background-color: var(--industrial-panel); padding: 15px; border-bottom: 1px solid var(--sena-green); }
        .nav-bar h2 { margin: 0; font-size: 1.2rem; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .nav-bar { flex-direction: column; gap: 10px; text-align: center; }
            .tabs { display: flex; width: 100%; }
            .tab-btn { flex: 1; padding: 12px 5px; font-size: 12px; }
        }

        /* Tabs */
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { background-color: transparent; color: var(--text-muted); border: 1px solid var(--industrial-border); box-shadow: none; border-radius: 4px; }
        .tab-btn.active { background-color: rgba(57, 169, 0, 0.1); color: var(--sena-green); border-color: var(--sena-green); }

        /* Lector QR Mobile */
        #reader-container { width: 100%; max-width: 500px; margin: 0 auto; overflow: hidden; border-radius: 8px; border: 2px solid var(--sena-green); background: #000; position: relative;}
        #reader { width: 100%; }
        
        /* Controles de Dirección (Botones grandes móviles) */
        .direction-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .dir-btn { flex: 1; padding: 20px; font-size: 1.2rem; background: var(--industrial-dark); border: 2px solid var(--industrial-border); color: var(--text-muted); }
        .dir-btn.active-in { background: rgba(57, 169, 0, 0.2); border-color: var(--sena-green); color: var(--sena-green); }
        .dir-btn.active-out { background: rgba(255, 152, 0, 0.2); border-color: var(--alert-orange); color: var(--alert-orange); }

        /* Modal QR */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--industrial-panel); padding: 30px; border-radius: 8px; text-align: center; border: 2px solid var(--sena-green); max-width: 90%; }
        #qrCodeCanvas { background: white; padding: 15px; border-radius: 4px; display: inline-block; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- 1. LOGIN -->
    <div id="loginView" class="container">
        <div class="card" style="max-width: 400px; margin: 5vh auto; text-align: center;">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="var(--sena-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Control Activos</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">
                Aprendiz: aprendiz / 123 <br> Vigilancia: admin / 123
            </p>
            <div id="loginAlert" class="alert hidden"></div>
            
            <form id="loginForm" style="text-align: left;">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Usuario" required autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" style="margin-top: 10px;">ACCEDER</button>
            </form>
        </div>
    </div>

    <!-- 2. PORTAL APRENDIZ -->
    <div id="userView" class="hidden">
        <div class="nav-bar">
            <h2>REGISTRO DE EQUIPOS</h2>
            <button class="btn-danger" onclick="cerrarSesion()">SALIR</button>
        </div>
        
        <div class="container">
            <div class="card">
                <div id="userAlert" class="alert hidden"></div>
                <form id="registroEquipoForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Propietario (Nombre Completo)</label>
                            <input type="text" id="regPropietario" required>
                        </div>
                        <div class="form-group">
                            <label>Programa de Formación</label>
                            <select id="regPrograma" required onchange="actualizarCategorias()">
                                <option value="">Seleccione...</option>
                                <option value="Soldadura">Soldadura</option>
                                <option value="Sistemas">Sistemas</option>
                                <option value="Mecanica">Mecánica</option>
                                <option value="Diseno">Diseño</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="regCategoria" required><option value="">Seleccione programa...</option></select>
                        </div>
                        <div class="form-group">
                            <label>Marca / Modelo</label>
                            <input type="text" id="regDetalle" required>
                        </div>
                        <div class="form-group full-width hidden">
                            <!-- Serial Oculto Auto-generado -->
                            <input type="text" id="regSerial" readonly>
                        </div>
                    </div>
                    <button type="submit" style="margin-top: 20px;">GENERAR IDENTIFICADOR QR</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL QR APRENDIZ -->
    <div id="modalQR" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px;">EQUIPO REGISTRADO</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0;">Guarde este QR para presentarlo en portería.</p>
            <div id="qrCodeCanvas"></div>
            <h4 id="qrSerialDisplay" style="color: #fff; letter-spacing: 2px;"></h4>
            <button onclick="cerrarModalQR()">ENTENDIDO / CERRAR</button>
        </div>
    </div>

    <!-- 3. TERMINAL VIGILANCIA (Móvil) -->
    <div id="adminView" class="hidden">
        <div class="nav-bar">
            <h2>MÓDULO PORTERÍA</h2>
            <button class="btn-danger" onclick="cerrarSesion()">SALIR</button>
        </div>

        <div class="container" style="padding-top: 0;">
            <div class="tabs">
                <button class="tab-btn active" id="tabScanner" onclick="cambiarTabAdmin('scanner')">ESCANEAR</button>
                <button class="tab-btn" id="tabBD" onclick="cambiarTabAdmin('bd')">INVENTARIO</button>
                <button class="tab-btn" id="tabHistorial" onclick="cambiarTabAdmin('historial')">HISTORIAL</button>
            </div>

            <!-- ESCÁNER -->
            <div id="secScanner" class="card" style="padding: 15px; text-align: center;">
                <div class="direction-controls">
                    <button id="btnIngreso" class="dir-btn active-in" onclick="setDireccion('INGRESO')">ENTRADA</button>
                    <button id="btnSalida" class="dir-btn" onclick="setDireccion('SALIDA')">SALIDA</button>
                </div>
                
                <div id="scannerAlert" class="alert alert-info">CÁMARA LISTA - APUNTE AL QR</div>
                
                <div id="reader-container">
                    <div id="reader"></div>
                </div>

                <div style="margin-top: 15px;">
                    <label>Búsqueda Manual (Si falla cámara)</label>
                    <input type="text" id="manualSerial" placeholder="Ej. SENA-A1B2C3" style="text-align: center; margin-bottom: 10px;">
                    <button onclick="procesarTransaccionManual()" style="background: var(--industrial-panel); border: 1px solid var(--sena-green); color: var(--sena-green);">VERIFICAR MANUAL</button>
                </div>
            </div>

            <!-- BD -->
            <div id="secBD" class="card hidden" style="padding: 10px;">
                <div style="overflow-x:auto;">
                    <table id="tablaBD">
                        <thead><tr><th>Serial</th><th>Datos</th><th>Estado</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- HISTORIAL -->
            <div id="secHistorial" class="card hidden" style="padding: 10px;">
                <div style="overflow-x:auto;">
                    <table id="tablaHistorial">
                        <thead><tr><th>Hora</th><th>Movimiento</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bdEquipos = {}; 
        const historialRegistros = [];
        let html5QrCode = null;
        let direccionActual = 'INGRESO';
        let isProcessing = false;

        const categorias = {
            "Soldadura": ["Careta", "Pulidora", "Herramienta", "Otro"],
            "Sistemas": ["Laptop", "Tablet", "Redes", "Otro"],
            "Mecanica": ["Caja Herramientas", "Scanner", "Multímetro", "Otro"],
            "Diseno": ["Tableta Gráfica", "Laptop", "Cámara", "Otro"]
        };

        function actualizarCategorias() {
            const prog = document.getElementById('regPrograma').value;
            const sel = document.getElementById('regCategoria');
            sel.innerHTML = '<option value="">Seleccione...</option>';
            if (categorias[prog]) {
                categorias[prog].forEach(cat => sel.innerHTML += `<option value="${cat}">${cat}</option>`);
            }
        }

        function mostrarAlerta(id, msj, tipo) {
            const alerta = document.getElementById(id);
            alerta.textContent = msj;
            alerta.className = `alert alert-${tipo}`;
            alerta.classList.remove('hidden');
        }

        function ocultarAlerta(id) { document.getElementById(id).classList.add('hidden'); }
        function obtenerFechaHora() {
            const d = new Date();
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        }
        function generarSerialUnico() {
            return 'SENA-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        function cerrarSesion() {
            detenerScanner();
            document.getElementById('userView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        // --- LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === 'aprendiz' && pass === '123') {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('userView').classList.remove('hidden');
                document.getElementById('registroEquipoForm').reset();
                document.getElementById('regSerial').value = generarSerialUnico();
                actualizarCategorias();
            } else if (user === 'admin' && pass === '123') {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                cambiarTabAdmin('scanner');
            } else {
                mostrarAlerta('loginAlert', 'ACCESO DENEGADO', 'error');
                setTimeout(() => ocultarAlerta('loginAlert'), 3000);
            }
        });

        // --- REGISTRO Y GENERACIÓN DE QR ---
        document.getElementById('registroEquipoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const serial = document.getElementById('regSerial').value;
            
            bdEquipos[serial] = {
                propietario: document.getElementById('regPropietario').value.trim(),
                programa: document.getElementById('regPrograma').value,
                categoria: document.getElementById('regCategoria').value,
                detalle: document.getElementById('regDetalle').value.trim(),
                estado: 'FUERA DE INSTALACIONES'
            };

            // Generar QR
            document.getElementById('qrCodeCanvas').innerHTML = "";
            new QRCode(document.getElementById('qrCodeCanvas'), { text: serial, width: 220, height: 220, colorDark : "#000000", colorLight : "#ffffff" });
            document.getElementById('qrSerialDisplay').textContent = serial;
            
            document.getElementById('modalQR').classList.remove('hidden');
            document.getElementById('registroEquipoForm').reset();
            document.getElementById('regSerial').value = generarSerialUnico(); 
        });

        function cerrarModalQR() {
            document.getElementById('modalQR').classList.add('hidden');
            mostrarAlerta('userAlert', 'EQUIPO REGISTRADO EXITOSAMENTE', 'success');
            setTimeout(() => ocultarAlerta('userAlert'), 4000);
        }

        // --- LÓGICA VIGILANCIA (CELADOR) ---
        function cambiarTabAdmin(tab) {
            document.querySelectorAll('#adminView .card').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tab === 'scanner') {
                document.getElementById('secScanner').classList.remove('hidden');
                document.getElementById('tabScanner').classList.add('active');
                iniciarScanner();
            } else {
                detenerScanner();
                if (tab === 'bd') {
                    document.getElementById('secBD').classList.remove('hidden');
                    document.getElementById('tabBD').classList.add('active');
                    renderizarBD();
                } else {
                    document.getElementById('secHistorial').classList.remove('hidden');
                    document.getElementById('tabHistorial').classList.add('active');
                    renderizarHistorial();
                }
            }
        }

        function setDireccion(dir) {
            direccionActual = dir;
            document.getElementById('btnIngreso').className = dir === 'INGRESO' ? 'dir-btn active-in' : 'dir-btn';
            document.getElementById('btnSalida').className = dir === 'SALIDA' ? 'dir-btn active-out' : 'dir-btn';
            mostrarAlerta('scannerAlert', `MODO: ${dir} - APUNTE AL QR`, 'info');
        }

        // --- ESCÁNER CON CÁMARA (html5-qrcode) ---
        function iniciarScanner() {
            if (html5QrCode == null) {
                html5QrCode = new Html5Qrcode("reader");
            }
            if (!html5QrCode.isScanning) {
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        if (!isProcessing) procesarEscaneo(decodedText);
                    },
                    (error) => { /* Ignorar errores de frame vacío */ }
                ).catch(err => {
                    mostrarAlerta('scannerAlert', 'ERROR AL ACCEDER A LA CÁMARA', 'error');
                });
            }
        }

        function detenerScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.error(err));
            }
        }

        function procesarTransaccionManual() {
            const serial = document.getElementById('manualSerial').value.trim().toUpperCase();
            if(serial) procesarEscaneo(serial);
            document.getElementById('manualSerial').value = "";
        }

        function procesarEscaneo(serial) {
            isProcessing = true;
            
            if (!bdEquipos[serial]) {
                mostrarAlerta('scannerAlert', `ERROR: QR INVÁLIDO O NO REGISTRADO`, 'error');
                setTimeout(() => { isProcessing = false; setDireccion(direccionActual); }, 3000);
                return;
            }

            const eq = bdEquipos[serial];
            
            if (direccionActual === 'INGRESO' && eq.estado === 'EN PLANTA') {
                mostrarAlerta('scannerAlert', `⚠️ YA ESTÁ EN PLANTA: ${eq.propietario}`, 'warning');
            } else if (direccionActual === 'SALIDA' && eq.estado === 'FUERA DE INSTALACIONES') {
                mostrarAlerta('scannerAlert', `⚠️ NO HAY REGISTRO DE ENTRADA: ${eq.propietario}`, 'warning');
            } else {
                eq.estado = direccionActual === 'INGRESO' ? 'EN PLANTA' : 'FUERA DE INSTALACIONES';
                historialRegistros.push({ hora: obtenerFechaHora(), serial: serial, mov: direccionActual, prop: eq.propietario });
                mostrarAlerta('scannerAlert', `✅ ${direccionActual} AUTORIZADA: ${eq.propietario}`, 'success');
                
                // Efecto de sonido corto (opcional mediante Web Audio API, simulado aquí visualmente)
                if (navigator.vibrate) navigator.vibrate(200);
            }

            // Pausa antes de leer otro código
            setTimeout(() => { 
                isProcessing = false; 
                setDireccion(direccionActual);
            }, 3000);
        }

        function renderizarBD() {
            const tb = document.querySelector('#tablaBD tbody');
            tb.innerHTML = "";
            for (const [serial, data] of Object.entries(bdEquipos)) {
                let cl = data.estado === 'EN PLANTA' ? 'var(--sena-green)' : '#64748b';
                tb.innerHTML += `
                    <tr>
                        <td style="font-weight:bold; font-size:12px;">${serial}</td>
                        <td style="font-size:12px;"><strong>${data.propietario}</strong><br>${data.categoria}</td>
                        <td style="color:${cl}; font-weight:bold; font-size:11px;">${data.estado}</td>
                    </tr>`;
            }
        }

        function renderizarHistorial() {
            const tb = document.querySelector('#tablaHistorial tbody');
            tb.innerHTML = "";
            [...historialRegistros].reverse().forEach(r => {
                let cl = r.mov === 'INGRESO' ? 'var(--sena-green)' : 'var(--alert-orange)';
                tb.innerHTML += `
                    <tr>
                        <td style="font-family:Jura; font-size:12px;">${r.hora}</td>
                        <td style="font-size:12px;"><span style="color:${cl}; font-weight:bold;">${r.mov}</span><br>${r.prop} (${r.serial})</td>
                    </tr>`;
            });
        }
    </script>
</body>
</html>
